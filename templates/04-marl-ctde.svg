<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="多智能体 CTDE"><title>多智能体 CTDE</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">多智能体 CTDE</text><text x="55" y="99" class="small">集中训练、分散执行；执行阶段每个主体只使用允许的观测与通信。</text><g><rect x="365" y="150" width="470" height="120" rx="4" class="node"/><text x="385" y="185" class="label" font-weight="700">集中训练的价值函数</text><text x="385" y="215" class="small">输入：训练允许的全局状态与联合动作</text><text x="385" y="241" class="small">更新各主体策略参数；训练后移除该支路</text></g><g><rect x="65" y="370" width="300" height="120" rx="4" class="node"/><text x="85" y="405" class="label" font-weight="700">主体 1 的局部策略</text><text x="85" y="435" class="small">局部观测 oₜⁱ → 动作 aₜⁱ</text><text x="85" y="461" class="small">可选：邻域通信 / 共享参数</text></g><path d="M600 270V315H215V370" class="learn"/><g><rect x="445" y="370" width="300" height="120" rx="4" class="node"/><text x="465" y="405" class="label" font-weight="700">主体 2 的局部策略</text><text x="465" y="435" class="small">局部观测 oₜⁱ → 动作 aₜⁱ</text><text x="465" y="461" class="small">可选：邻域通信 / 共享参数</text></g><path d="M600 270V315H595V370" class="learn"/><text x="625" y="320" class="small">参数更新</text><g><rect x="825" y="370" width="300" height="120" rx="4" class="node"/><text x="845" y="405" class="label" font-weight="700">主体 3 的局部策略</text><text x="845" y="435" class="small">局部观测 oₜⁱ → 动作 aₜⁱ</text><text x="845" y="461" class="small">可选：邻域通信 / 共享参数</text></g><path d="M600 270V315H975V370" class="learn"/><g><rect x="330" y="555" width="540" height="85" rx="4" class="node"/><text x="350" y="590" class="label" font-weight="700">共享环境 / 网络化过程</text><text x="350" y="620" class="small">联合动作改变系统；各主体获得自己的观测和奖励</text></g><path d="M215 490V525H600V555" class="flow"/><path d="M595 490V525H600V555" class="flow"/><path d="M975 490V525H600V555" class="flow"/><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">虚线 = 训练更新。CTDE 是一种组织方式，不代表所有多主体算法都使用集中 critic。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>