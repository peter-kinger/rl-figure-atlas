<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="约束 MDP 与执行前安全层"><title>约束 MDP 与执行前安全层</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">约束 MDP 与执行前安全层</text><text x="55" y="99" class="small">奖励优化与约束检查是两条信息通路；根据方法选择可行域过滤或惩罚。</text><g><rect x="55" y="210" width="270" height="130" rx="4" class="node"/><text x="75" y="245" class="label" font-weight="700">候选策略</text><text x="75" y="275" class="small">输出候选动作 aₜ</text><text x="75" y="301" class="small">优化任务回报 Jᴿ</text></g><g><rect x="430" y="210" width="310" height="130" rx="4" class="node"/><text x="450" y="245" class="label" font-weight="700">安全层 / 可行域</text><text x="450" y="275" class="small">状态相关动作约束</text><text x="450" y="301" class="small">输出可执行动作 ãₜ</text></g><g><rect x="845" y="210" width="300" height="130" rx="4" class="node"/><text x="865" y="245" class="label" font-weight="700">受控环境</text><text x="865" y="275" class="small">更新状态与任务奖励</text><text x="865" y="301" class="small">返回约束代价 cₜ₊₁</text></g><path d="M325 270H430" class="flow"/><text x="370" y="251" class="small">aₜ</text><path d="M740 270H845" class="flow"/><text x="781" y="251" class="small">ãₜ</text><path d="M995 340V420H190V340" class="flow"/><text x="465" y="406" class="small">状态、奖励与约束代价</text><g><rect x="300" y="500" width="610" height="125" rx="4" class="node"/><text x="320" y="535" class="label" font-weight="700">评估需同时展示</text><text x="320" y="565" class="small">任务表现 · 约束违例率 · 违例严重度 · 控制开销</text><text x="320" y="591" class="small">必要时画风险—收益关系，而不是只报总回报</text></g><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">可行域过滤的有效性依赖状态和模型；经验上零违例不等于形式化安全证明。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>