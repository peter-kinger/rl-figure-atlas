<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="训练与部署的两条闭环"><title>训练与部署的两条闭环</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">训练与部署的两条闭环</text><text x="55" y="99" class="small">明确哪些数据用于学习，哪些信息在实际运行时可用。</text><g><rect x="55" y="180" width="300" height="140" rx="4" class="node"/><text x="75" y="215" class="label" font-weight="700">训练环境</text><text x="75" y="245" class="small">物理模拟器 / 数字孪生</text><text x="75" y="271" class="small">参数扰动与场景采样</text></g><g><rect x="450" y="180" width="300" height="140" rx="4" class="node"/><text x="470" y="215" class="label" font-weight="700">学习器 + 经验库</text><text x="470" y="245" class="small">采样 transition / trajectory</text><text x="470" y="271" class="small">更新策略参数 θ</text></g><g><rect x="850" y="180" width="300" height="140" rx="4" class="node"/><text x="870" y="215" class="label" font-weight="700">策略检查点</text><text x="870" y="245" class="small">验证集选择</text><text x="870" y="271" class="small">冻结版本并记录配置</text></g><path d="M355 250H450" class="flow"/><text x="380" y="232" class="small">经验</text><path d="M750 250H850" class="learn"/><text x="778" y="232" class="small">更新 θ</text><g><rect x="135" y="470" width="360" height="130" rx="4" class="node"/><text x="155" y="505" class="label" font-weight="700">真实 / 留出测试环境</text><text x="155" y="535" class="small">测试事件、年份、区域</text><text x="155" y="561" class="small">与训练数据隔离</text></g><g><rect x="725" y="470" width="350" height="130" rx="4" class="node"/><text x="745" y="505" class="label" font-weight="700">部署策略 πθ</text><text x="745" y="535" class="small">仅输入在线观测</text><text x="745" y="561" class="small">输出可执行控制动作</text></g><path d="M1000 320V400H900V470" class="learn"/><text x="1015" y="400" class="small">部署</text><path d="M725 520H495" class="flow"/><text x="585" y="506" class="small">动作</text><path d="M315 600V640H900V600" class="flow"/><text x="570" y="630" class="small">观测反馈</text><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">若部署时继续学习，应标注更新通路，并将在线适应与冻结策略测试分开。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>