<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="分析图组合草图"><title>分析图组合草图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">分析图组合草图</text><text x="55" y="99" class="small">空白布局模板，无实验数据。替换为实际结果，并标明统计单位与不确定性。</text><text x="65" y="155" class="label">a  学习效率</text><path d="M125 190V330H555" fill="none" stroke="#233c38"/><text x="215" y="363" class="small">环境交互步数</text><text x="150" y="225" class="small">留出评估回报</text><text x="265" y="290" class="small">填入真实实验数据</text><text x="640" y="155" class="label">b  实际任务表现</text><path d="M700 190V330H1130" fill="none" stroke="#233c38"/><text x="790" y="363" class="small">基线与提出方法</text><text x="725" y="225" class="small">物理指标 / 成功率</text><text x="840" y="290" class="small">填入真实实验数据</text><text x="65" y="410" class="label">c  策略行为</text><path d="M125 445V585H555" fill="none" stroke="#233c38"/><text x="215" y="618" class="small">时间 / 空间位置</text><text x="150" y="480" class="small">动作与系统响应</text><text x="265" y="545" class="small">填入真实实验数据</text><text x="640" y="410" class="label">d  风险与权衡</text><path d="M700 445V585H1130" fill="none" stroke="#233c38"/><text x="790" y="618" class="small">成本 / 风险</text><text x="725" y="480" class="small">收益 / 生态效益</text><text x="840" y="545" class="small">填入真实实验数据</text><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">在图注写清：