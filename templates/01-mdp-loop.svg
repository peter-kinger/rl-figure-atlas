<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="MDP 决策闭环"><title>MDP 决策闭环</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">MDP 决策闭环</text><text x="55" y="99" class="small">定义实体与时间顺序，再添加网络结构。示例为作者原创框架，不是论文原图。</text><g><rect x="70" y="180" width="350" height="140" rx="4" class="node"/><text x="90" y="215" class="label" font-weight="700">策略 / Agent</text><text x="90" y="245" class="small">输入：可用于决策的 sₜ</text><text x="90" y="271" class="small">输出：aₜ ~ πθ(· | sₜ)</text></g><g><rect x="730" y="180" width="390" height="140" rx="4" class="node"/><text x="750" y="215" class="label" font-weight="700">环境 / Process</text><text x="750" y="245" class="small">物理过程与人类响应</text><text x="750" y="271" class="small">sₜ₊₁ ~ P(· | sₜ, aₜ)</text></g><path d="M420 235H730" class="flow"/><text x="535" y="216" class="small">动作 aₜ</text><path d="M920 320V410H240V320" class="flow"/><text x="460" y="399" class="small">下一状态 sₜ₊₁、奖励 rₜ₊₁</text><g><rect x="350" y="490" width="520" height="125" rx="4" class="node"/><text x="370" y="525" class="label" font-weight="700">任务定义</text><text x="370" y="555" class="small">状态 S · 动作 A · 转移 P · 奖励 R · 折扣 γ</text><text x="370" y="581" class="small">优化期望折扣累计奖励；标注终止条件与决策间隔</text></g><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">实线 = 环境交互。完整状态不可获取时，应改用观测和记忆，不直接假定 MDP。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>