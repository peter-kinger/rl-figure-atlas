<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="人地耦合的双层治理决策"><title>人地耦合的双层治理决策</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">人地耦合的双层治理决策</text><text x="55" y="99" class="small">此图为概念框架；需要按具体研究定义政策时标、个体行动与生态反馈。</text><g><rect x="65" y="170" width="350" height="140" rx="4" class="node"/><text x="85" y="205" class="label" font-weight="700">规划者 / 治理策略</text><text x="85" y="235" class="small">观测：系统指标与社会统计</text><text x="85" y="261" class="small">动作：配额、税率、激励</text></g><g><rect x="780" y="170" width="350" height="140" rx="4" class="node"/><text x="800" y="205" class="label" font-weight="700">个体 / 区域主体</text><text x="800" y="235" class="small">观测：资源、价格、局部环境</text><text x="800" y="261" class="small">动作：生产、取水、减排</text></g><path d="M415 230H780" class="flow"/><text x="490" y="210" class="small">慢尺度政策 / 约束</text><path d="M780 290H415" class="flow"/><text x="515" y="275" class="small">社会结果反馈</text><g><rect x="350" y="465" width="500" height="140" rx="4" class="node"/><text x="370" y="500" class="label" font-weight="700">地球系统过程</text><text x="370" y="530" class="small">生态、水文、气候与资源动态</text><text x="370" y="556" class="small">状态转移影响主体机会与制度目标</text></g><path d="M955 310V530H850" class="flow"/><text x="975" y="425" class="small">资源利用</text><path d="M350 530H235V310" class="flow"/><text x="80" y="440" class="small">系统反馈</text><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">规划者目标、主体效用和生态指标须分别定义；不要把社会福利简化为所有主体同质。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>