<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="世界模型与想象策略学习"><title>世界模型与想象策略学习</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">世界模型与想象策略学习</text><text x="55" y="99" class="small">真实经验训练环境模型，模型生成的想象轨迹用于策略优化。</text><g><rect x="55" y="200" width="280" height="140" rx="4" class="node"/><text x="75" y="235" class="label" font-weight="700">真实环境经验</text><text x="75" y="265" class="small">观测 oₜ · 动作 aₜ</text><text x="75" y="291" class="small">奖励 rₜ₊₁ · 下一观测</text></g><g><rect x="450" y="200" width="300" height="140" rx="4" class="node"/><text x="470" y="235" class="label" font-weight="700">学习到的世界模型</text><text x="470" y="265" class="small">编码、潜在动态与预测</text><text x="470" y="291" class="small">估计奖励和未来表征</text></g><g><rect x="865" y="200" width="280" height="140" rx="4" class="node"/><text x="885" y="235" class="label" font-weight="700">想象 rollout</text><text x="885" y="265" class="small">由模型生成</text><text x="885" y="291" class="small">不能标作真实测量</text></g><path d="M335 265H450" class="learn"/><text x="354" y="245" class="small">拟合模型</text><path d="M750 265H865" class="flow"/><text x="790" y="245" class="small">展开</text><g><rect x="450" y="490" width="360" height="120" rx="4" class="node"/><text x="470" y="525" class="label" font-weight="700">Actor–Critic 学习</text><text x="470" y="555" class="small">用想象回报更新策略与价值</text><text x="470" y="581" class="small">策略再与真实环境交互</text></g><path d="M1005 340V545H810" class="learn"/><text x="970" y="450" class="small">想象轨迹</text><path d="M450 550H190V340" class="flow"/><text x="220" y="533" class="small">新的真实交互</text><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">长时模型误差会累积；模型预测准确性与控制收益需要分别验证。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>