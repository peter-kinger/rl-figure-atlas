<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="分层决策与时间尺度"><title>分层决策与时间尺度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">分层决策与时间尺度</text><text x="55" y="99" class="small">上层给出目标或子任务，下层按较快节奏执行；环境反馈跨尺度返回。</text><g><rect x="70" y="190" width="370" height="145" rx="4" class="node"/><text x="90" y="225" class="label" font-weight="700">上层策略</text><text x="90" y="255" class="small">每 K 步：更新目标 gₖ</text><text x="90" y="281" class="small">如：区域配置 / 月度水量</text></g><g><rect x="760" y="190" width="370" height="145" rx="4" class="node"/><text x="780" y="225" class="label" font-weight="700">下层策略</text><text x="780" y="255" class="small">每个决策步：输出动作 aₜ</text><text x="780" y="281" class="small">如：闸门开度 / 日调水量</text></g><path d="M440 260H760" class="flow"/><text x="535" y="240" class="small">目标 / 子任务 gₖ</text><g><rect x="380" y="490" width="450" height="125" rx="4" class="node"/><text x="400" y="525" class="label" font-weight="700">环境过程与目标达成</text><text x="400" y="555" class="small">记录实际状态、底层奖励与上层累计结果</text></g><path d="M945 335V550H830" class="flow"/><text x="960" y="450" class="small">执行</text><path d="M380 550H240V335" class="flow"/><text x="95" y="435" class="small">目标级反馈</text><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">上层和下层的奖励、终止条件、折扣和更新周期需要各自标注。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>