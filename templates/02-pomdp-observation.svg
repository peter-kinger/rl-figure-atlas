<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="POMDP 观测与信念"><title>POMDP 观测与信念</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36745f"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233c38}.label{font-size:19px}.small{font-size:15px;fill:#57716a}.node{fill:#fffefa;stroke:#aebbb1;stroke-width:1.5}.flow{fill:none;stroke:#36745f;stroke-width:2.5;marker-end:url(#arrow)}.learn{fill:none;stroke:#46758a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f7f6f0"/><text x="55" y="62" font-size="32" font-weight="700">POMDP 观测与信念</text><text x="55" y="99" class="small">把真实过程、观测通道和决策者的内部记忆分开。</text><g><rect x="55" y="200" width="310" height="150" rx="4" class="node"/><text x="75" y="235" class="label" font-weight="700">真实环境状态 sₜ</text><text x="75" y="265" class="small">生态 / 水文 / 社会过程</text><text x="75" y="291" class="small">系统真实状态可能不可见</text></g><g><rect x="440" y="200" width="300" height="150" rx="4" class="node"/><text x="460" y="235" class="label" font-weight="700">观测模型 O</text><text x="460" y="265" class="small">监测、遥感、传感器</text><text x="460" y="291" class="small">产生局部观测 oₜ</text></g><g><rect x="815" y="200" width="330" height="150" rx="4" class="node"/><text x="835" y="235" class="label" font-weight="700">策略 π(aₜ | bₜ)</text><text x="835" y="265" class="small">bₜ = 信念 / 记忆表征</text><text x="835" y="291" class="small">由历史观测和动作更新</text></g><path d="M365 270H440" class="flow"/><text x="378" y="250" class="small">采样</text><path d="M740 270H815" class="flow"/><text x="759" y="250" class="small">oₜ</text><path d="M975 350V440H200V350" class="flow"/><text x="480" y="428" class="small">动作 aₜ 作用于环境</text><g><rect x="330" y="505" width="560" height="110" rx="4" class="node"/><text x="350" y="540" class="label" font-weight="700">观测实验</text><text x="350" y="570" class="small">比较缺测、噪声、延迟、监测频率；以相同环境测试策略</text></g><path d="M55 680H1145" stroke="#aebbb1"/><text x="55" y="713" class="small">模拟器中的全局变量不等于在线观测；历史窗口不自动保证完全可观测。</text><text x="55" y="740" font-size="12">RL FIGURE ATLAS · Original editable template · CC BY 4.0 · 2026</text></svg>